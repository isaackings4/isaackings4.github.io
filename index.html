<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DJ ISAACKINGS4 | Site Officiel</title>

  <meta name="description" content="Site officiel de DJ ISAACKINGS4 — musique, nouveautés et actualités.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #050505;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    header {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
    }

    .photo {
      width: 230px;
      height: 230px;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid #ffffff;
      box-shadow: 0 0 35px rgba(255,255,255,0.15);
      margin-bottom: 30px;
    }

    h1 {
      font-size: 38px;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    .subtitle {
      color: #aaa;
      font-size: 17px;
      margin-bottom: 35px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 320px;
    }

    a {
      text-decoration: none;
      color: white;
      border: 1px solid #444;
      padding: 15px;
      border-radius: 30px;
      transition: 0.3s;
      background: #111;
    }

    a:hover {
      background: white;
      color: black;
    }

    footer {
      position: absolute;
      bottom: 20px;
      width: 100%;
      color: #666;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>

    <img src="ma-photo-1.jpg" alt="DJ ISAACKINGS4" class="photo">

    <h1>DJ ISAACKINGS4</h1>

    <p class="subtitle">
      Site officiel
    </p>

    <div class="buttons">
      <a href="#">🎵 Ma musique</a>
      <a href="#">▶️ YouTube</a>
      <a href="#">🎧 Nouveautés</a>
      <a href="#">📱 TikTok</a>
    </div>

  </header>

  <footer>
    © 2026 DJ ISAACKINGS4 — Tous droits réservés
  </footer>

</body>
</html>
